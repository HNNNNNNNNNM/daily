<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="기도 한 줄">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>기도 한 줄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3;--surface:#F8FAFB;--ink:#1C2733;--muted:#677483;--line:#D3DAE1;
  --pray:#2F4E6E;--pray-soft:#DCE5EE;--ans:#7A6818;--ans-soft:#EFE8CC;--thx:#96525C;--thx-soft:#F1E0E2;
  --danger:#9B3B3B;--ok:#4F7D5C;
  --serif:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171D;--surface:#1A2129;--ink:#E3E8ED;--muted:#8D99A6;--line:#2B343E;
  --pray:#93B3D3;--pray-soft:#1E2A37;--ans:#D8C067;--ans-soft:#2D2915;--thx:#DB9AA3;--thx-soft:#33222A;
  --danger:#E08B8B;--ok:#8CC09A;}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:20px 20px calc(100px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:2px solid var(--pray);outline-offset:2px}
.c-g{--k:var(--thx);--ks:var(--thx-soft)}.c-p{--k:var(--pray);--ks:var(--pray-soft)}.c-a{--k:var(--ans);--ks:var(--ans-soft)}

.top{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 0 4px}
.date{font:700 30px/1.2 var(--serif);letter-spacing:-.01em}
.wd{color:var(--muted);font-size:14px;margin-top:2px}
.tools{display:flex;align-items:center;gap:2px}
.eye{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 8px;border-radius:7px}
.eye[aria-pressed="true"]{color:var(--ink);background:var(--line)}
.dot{width:32px;height:32px;border:0;background:none;display:grid;place-items:center;padding:0}
.dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.ok::after{background:var(--ok)}.dot.err::after{background:var(--danger)}.dot.busy::after{background:var(--ans)}
body.hide .line .tx,body.hide .float .chip{filter:blur(7px);user-select:none}

/* 대상 줄: 쓰는 칸 밖에 따로 */
.who{display:flex;gap:6px;overflow-x:auto;margin:18px -20px 0;padding:2px 20px 4px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who .lbl{flex:none;align-self:center;font-size:12px;color:var(--muted);margin-right:2px}
.wchip{flex:none;border:1px dashed var(--muted);background:none;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.wchip[aria-pressed="true"]{border:1px solid var(--pray);background:var(--pray);color:var(--surface)}

.composer{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--k);border-radius:14px;padding:12px 14px;margin:10px 0 6px}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;background:var(--bg);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 13px;border-radius:7px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg.types button[aria-pressed="true"]{color:var(--k)}
.datechip{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:4px 8px;font:13px var(--sans);min-height:30px}
.datechip.past{color:var(--ans);border-color:var(--ans);font-weight:600}
#ta{display:block;width:100%;border:0;background:none;resize:none;font:17px/1.65 var(--serif);color:var(--ink);padding:10px 0 6px;min-height:46px;outline:none;overflow:hidden}
#ta::placeholder{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:12px}
.btn{border:0;border-radius:9px;padding:8px 16px;font-weight:600;font-size:14px;background:var(--pray);color:var(--surface)}
.composer .btn.primary{background:var(--k)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.btn.small{padding:4px 10px;font-size:12px;font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.float{flex:1;min-width:0}
.float .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pray-soft);border-color:var(--pray)}
.chip.soft{border-color:var(--ans-soft);background:var(--ans-soft)}

h2{font-size:13px;font-weight:600;color:var(--muted);margin:28px 0 6px}
h2.mh{display:flex;justify-content:space-between;color:var(--ink);font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
h2.mh span{color:var(--muted);font-weight:400;font-size:12px}
.grp{margin:4px 0 12px}
.gl{font-size:12px;font-weight:600;color:var(--k)}
.entry{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--k);padding:4px 0 4px 12px;margin:10px 0}
.entry .tx{font:16px/1.7 var(--serif);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.entry .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted);margin-top:1px}
.wp{border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--ink)}
.tag{color:var(--k)}
.blk{border-left:3px solid var(--k);padding:0 0 0 12px;margin:8px 0 14px}
.bh{font-size:12px;font-weight:600;color:var(--k);padding-top:2px}
.line{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 0;font:16px/1.7 var(--serif);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.line+.line{border-top:1px dashed var(--line)}
.lm{display:inline-flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-left:8px;font:12px/1.4 var(--sans);color:var(--muted);vertical-align:1px;white-space:normal}
.hr{display:flex;align-items:center;gap:8px;font:600 12px var(--sans);color:var(--muted);margin:12px 0 0;font-variant-numeric:tabular-nums}
.hr::after{content:"";flex:1;height:1px;background:var(--line)}
.dl{font-size:13px;font-weight:600;margin:16px 0 0}
.retro .dl{font-weight:500;color:var(--muted);margin-top:4px}
.retro{margin:6px 0 14px}
.retro .rl{font:600 13px var(--sans);color:var(--ans)}
.empty{color:var(--muted);font-size:14px;margin:28px 0}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:15px var(--sans);margin:14px 0 10px}

.field{display:block;margin:12px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:15px var(--sans)}
.field input[type=number]{width:90px}
.sub{color:var(--muted);font-size:13px;margin:4px 0}
.status{font-size:13px;margin:8px 0}
.status.err{color:var(--danger)}
.toggle{display:flex;gap:10px;align-items:center;margin:10px 0}
.toggle input{width:18px;height:18px;accent-color:var(--pray)}
.danger-zone{margin-top:32px;padding-top:4px;border-top:1px solid var(--line)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;max-width:186px;border:0;background:none;padding:13px 0 11px;font-weight:500;font-size:13px;color:var(--muted)}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(10,15,20,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:86vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .24s ease;z-index:11}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sheet h3{font-size:13px;font-weight:600;color:var(--muted);margin:24px 0 8px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--ks);color:var(--k)}
.dd{font-size:13px;color:var(--muted)}
.big{font:19px/1.75 var(--serif);margin:14px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.ed{width:100%;min-height:96px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:17px/1.6 var(--serif);resize:vertical}
.thread{margin:6px 0 0 5px;padding-left:18px;border-left:2px solid var(--line)}
.node{position:relative;margin:0 0 14px}
.node::before{content:"";position:absolute;left:-24.5px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--k)}
.elapsed{font-size:12px;font-weight:600;color:var(--k)}
.node .open{display:block;text-align:left;border:0;background:none;padding:0;font:16px/1.65 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere}
.node .nm{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.link-x{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.pick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.pick .pd{display:block;font-size:12px;color:var(--muted)}
.pick .pt{font:15px/1.6 var(--serif)}
.cand{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.back{border:0;background:none;color:var(--muted);font-size:13px;padding:0;margin-bottom:8px}

.verse{display:block;text-decoration:none;color:inherit;margin:16px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--ks);transition:opacity .18s ease}
.verse.fade{opacity:0}
.verse .vt{display:block;font:15px/1.75 var(--serif);color:var(--ink);opacity:.82;word-break:keep-all}
.verse .vr{display:block;font-size:12px;color:var(--k);margin-top:2px}
@media (prefers-reduced-motion:reduce){.verse{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="화면">
  <button data-view="write">쓰기</button>
  <button data-view="look">돌아보기</button>
  <button data-view="settings">설정</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ---------- 기본 ---------- */
const LS_DATA='pj.data', LS_SET='pj.settings', FILE='prayer-journal.json', GH='https://api.github.com/gists';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const NAME={g:'감사',p:'간청',a:'응답'};
let data=load(LS_DATA,{v:1,entries:[],links:[]});
data.entries=data.entries||[];data.links=data.links||[];data.cfg=Object.assign({targets:[],thanks:3,u:0},data.cfg||{});
let set=Object.assign({token:'',gistId:'',pass:'',reverse:true,hide:false,verse:true},load(LS_SET,{}));
const saveSet=()=>store(LS_SET,set);
let ui={view:'write',mode:'g',manual:false,filter:'all',tag:null,q:'',draft:'',date:null,who:[],flo:null,edit:null};
let stack=[];

/* ---------- 날짜 ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const WD='일월화수목금토';
const fmtShort=s=>{const d=parseD(s);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const fmtShortY=s=>{const d=parseD(s);return (d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+'년 ':'')+fmtShort(s)};
const fmtFull=s=>{const d=parseD(s);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const byDate=(a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.c||0)-(b.c||0);
const TAG_RE=/#([^\s#.,!?]+)/g;
const tagsOf=t=>[...new Set([...t.matchAll(TAG_RE)].map(m=>m[1]))];
const topicsOf=e=>[...new Set([...tagsOf(e.text),...(e.who||[])])];
const fmtText=t=>esc(t).replace(TAG_RE,'<span class="tag">#$1</span>');
const disp=w=>w.replace(/_/g,' ');
const snip=(t,n=22)=>{t=t.replace(/\s+/g,' ');return t.length>n?t.slice(0,n)+'…':t};

/* ---------- 데이터 ---------- */
const targets=()=>data.cfg.targets||[];
const THX=()=>Math.max(1,Math.min(10,+data.cfg.thanks||3));
const alive=()=>data.entries.filter(e=>!e.del);
const byId=id=>data.entries.find(e=>e.id===id&&!e.del);
const liveLinks=()=>data.links.filter(l=>!l.del&&byId(l.p)&&byId(l.a));
function linkedOf(e){const L=liveLinks();return e.t==='p'?L.filter(l=>l.p===e.id).map(l=>byId(l.a)):L.filter(l=>l.a===e.id).map(l=>byId(l.p))}
function isLinked(p,a){return data.links.some(l=>l.p===p&&l.a===a&&!l.del)}
function setLink(p,a,on){let l=data.links.find(x=>x.p===p&&x.a===a);if(!l){if(!on)return;l={p,a};data.links.push(l)}l.del=!on;l.u=Date.now();commit()}
function addEntry(t,text,d,who){const n=Date.now(),e={id:uid(),t,text,d:d||today(),c:n,u:n};if(who&&who.length)e.who=[...who];data.entries.push(e);commit();return e}
function delEntry(e){e.del=true;e.text='';e.who=undefined;e.u=Date.now();commit()}
function setCfg(patch){data.cfg=Object.assign({},data.cfg,patch,{u:Date.now()});commit()}
function commit(){store(LS_DATA,data);IDX=null;schedulePush()}
function merge(a,b){
  const m=new Map();for(const e of[...(a.entries||[]),...(b.entries||[])]){const x=m.get(e.id);if(!x||(e.u||0)>(x.u||0))m.set(e.id,e)}
  const L=new Map();for(const l of[...(a.links||[]),...(b.links||[])]){const k=l.p+'|'+l.a,x=L.get(k);if(!x||(l.u||0)>(x.u||0))L.set(k,l)}
  const ca=a.cfg||{u:0},cb=b.cfg||{u:0};
  return{v:1,entries:[...m.values()],links:[...L.values()],cfg:Object.assign({targets:[],thanks:3,u:0},(ca.u||0)>=(cb.u||0)?ca:cb)};
}
const canon=d=>JSON.stringify([d.cfg||null,[...d.entries].sort((x,y)=>x.id<y.id?-1:1),[...d.links].sort((x,y)=>(x.p+x.a)<(y.p+y.a)?-1:1)]);

/* ---------- 닮은 기록 찾기 ---------- */
const PARTICLES=['에서는','으로는','에게서','께서는','이라고','라고','까지','부터','에서','에게','한테','께서','으로','처럼','보다','마다','이나','하고','은','는','이','가','을','를','에','의','와','과','도','로','만','요'];
const STOP=new Set(['기도','여호와','하느님','하나님','감사','감사합니다','감사드립니다','주십시오','주세요','도와','오늘','정말','너무','있게','하게','것','수','더','잘','좀','저','제','우리','그리고','있도록','합니다','드립니다']);
function feats(text){
  const f=new Map(),add=(k,w)=>f.set(k,(f.get(k)||0)+w);
  const words=text.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(Boolean);
  for(let w of words){
    for(const p of PARTICLES){if(w.length>p.length+1&&w.endsWith(p)){w=w.slice(0,-p.length);break}}
    if(STOP.has(w)||w.length<2)continue;
    add('w:'+w,1);for(let i=0;i<w.length-1;i++)add('b:'+w.slice(i,i+2),.5);
  }
  return f;
}
let IDX=null;
function vec(f,df,N){const v=new Map();let n=0;for(const[k,tf]of f){const w=tf*(Math.log((N+1)/((df.get(k)||0)+1))+1);v.set(k,w);n+=w*w}return{v,n:Math.sqrt(n)||1}}
function index(){
  if(IDX)return IDX;
  const es=alive(),F=new Map(),df=new Map();
  for(const e of es){const f=feats(e.text);F.set(e.id,f);for(const k of f.keys())df.set(k,(df.get(k)||0)+1)}
  const V=new Map();for(const e of es)V.set(e.id,vec(F.get(e.id),df,es.length));
  return IDX={df,N:es.length,V};
}
function cos(a,b){let s=0;const[x,y]=a.v.size<b.v.size?[a,b]:[b,a];for(const[k,w]of x.v){const u=y.v.get(k);if(u)s+=w*u}return s/(a.n*b.n)}
function similar(src,types,{k=5,min=.15,exclude=new Set(),topics=[]}={}){
  const I=index(),isStr=typeof src==='string';
  const sv=isStr?vec(feats(src),I.df,I.N):I.V.get(src.id);if(!sv)return[];
  const st=[...new Set([...(isStr?tagsOf(src):topicsOf(src)),...topics])],out=[];
  for(const e of alive()){
    if(!types.includes(e.t)||exclude.has(e.id)||(!isStr&&e.id===src.id))continue;
    let s=cos(sv,I.V.get(e.id));
    if(st.length&&topicsOf(e).some(t=>st.includes(t)))s+=.35;
    if(s>=min)out.push({e,s});
  }
  return out.sort((a,b)=>b.s-a.s).slice(0,k).map(x=>x.e);
}

/* ---------- 이맘때 ---------- */
function retro(){
  const t=parseD(today()),used=new Set(),groups=[];
  const offs=[['한 달 전',0,1],['석 달 전',0,3],['반년 전',0,6],['1년 전',1,0],['2년 전',2,0],['3년 전',3,0]];
  for(const[label,y,m]of offs){
    const c=ymd(new Date(t.getFullYear()-y,t.getMonth()-m,t.getDate()));
    const items=alive().filter(e=>!used.has(e.id)&&Math.abs(daysBetween(c,e.d))<=2).sort(byDate);
    items.forEach(e=>used.add(e.id));if(items.length)groups.push({label,items});
  }
  return groups;

/* ---------- 암호화 ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function keyFrom(pass,salt){const base=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await keyFrom(pass,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,TE.encode(JSON.stringify(obj))));return{enc:1,salt:b64(salt),iv:b64(iv),data:b64(ct)}}
async function unseal(env,pass){const k=await keyFrom(pass,unb64(env.salt));return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},k,unb64(env.data))))}
async function readAny(obj){
  if(!obj.enc)return obj;
  if(!set.pass)throw new Error('암호화된 기록이에요. 설정에서 암호문을 넣어 주세요');
  try{return await unseal(obj,set.pass)}catch(e){throw new Error('암호문이 맞지 않아요')}
}

/* ---------- Gist 동기화 ---------- */
const hdr=()=>({Authorization:'Bearer '+set.token,Accept:'application/vnd.github+json','Content-Type':'application/json'});
const configured=()=>!!(set.token&&set.gistId);
const payload=async d=>JSON.stringify(set.pass?await seal(d,set.pass):d);
async function gistPull(){
  const r=await fetch(`${GH}/${set.gistId}`,{headers:hdr(),cache:'no-store'});
  if(!r.ok)throw new Error(r.status===401?'토큰이 유효하지 않아요':r.status===404?'Gist를 찾을 수 없어요':`불러오지 못했어요 (${r.status})`);
  const g=await r.json(),f=g.files&&g.files[FILE];if(!f)return null;
  const txt=f.truncated?await(await fetch(f.raw_url,{cache:'no-store'})).text():f.content;
  if(!txt||!txt.trim())return null;
  return readAny(JSON.parse(txt));
}
async function gistPush(d){
  const r=await fetch(`${GH}/${set.gistId}`,{method:'PATCH',headers:hdr(),body:JSON.stringify({files:{[FILE]:{content:await payload(d)}}})});
  if(!r.ok)throw new Error(`올리지 못했어요 (${r.status})`);
}
async function gistCreate(){
  const r=await fetch(GH,{method:'POST',headers:hdr(),body:JSON.stringify({description:'기도 한 줄',public:false,files:{[FILE]:{content:await payload(data)}}})});
  if(!r.ok)throw new Error(r.status===401?'토큰이 유효하지 않아요':`만들지 못했어요 (${r.status})`);
  set.gistId=(await r.json()).id;saveSet();
}
let syncing=false,again=false,pushT=null,sync_={ok:null,msg:'동기화 꺼짐'};
function schedulePush(){if(!configured())return;clearTimeout(pushT);pushT=setTimeout(sync,1200)}
async function sync(){
  if(!configured())return;
  if(syncing){again=true;return}
  syncing=true;clearTimeout(pushT);setStatus(null,'동기화 중');
  try{
    const remote=await gistPull();
    const merged=remote?merge(data,remote):data;
    const localChanged=canon(merged)!==canon(data);
    data=merged;store(LS_DATA,data);IDX=null;
    if(!remote||canon(merged)!==canon(remote))await gistPush(data);
    const t=new Date();setStatus(true,`동기화됨 ${pad(t.getHours())}:${pad(t.getMinutes())}`);
    if(localChanged)softRender();
  }catch(e){setStatus(false,e.message)}
  syncing=false;if(again){again=false;sync()}
}

  <label class="field"><span>GitHub 토큰</span><input type="password" data-set="token" value="${esc(set.token)}" autocomplete="off"></label>
  <label class="field"><span>Gist ID</span><input type="text" data-set="gistId" value="${esc(set.gistId)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <div class="row">${set.token&&!set.gistId?`<button class="btn" data-act="createGist">새 Gist 만들기</button>`:''}${configured()?`<button class="btn ghost" data-act="syncNow">지금 동기화</button>`:''}</div>
  <p class="status${sync_.ok===false?' err':''}" id="syncMsg">${esc(configured()?sync_.msg:'토큰과 Gist ID를 넣으면 동기화가 켜져요')}</p>
  <h2>암호화</h2>
  <p class="sub">비밀 Gist도 주소를 알면 열려요. 암호문을 넣으면 내용을 잠가서 올려요. 모든 기기에 같은 암호문을 넣어야 하고, 잊으면 되찾을 수 없어요.</p>
  <label class="field"><span>암호문</span><input type="password" data-set="pass" value="${esc(set.pass)}" autocomplete="new-password"></label>
  <h2>내보내기와 백업</h2>
  <div class="row" style="justify-content:flex-start"><button class="btn ghost" data-act="exMd">마크다운 내보내기</button><button class="btn ghost" data-act="exJson">JSON 백업</button><button class="btn ghost" data-act="imJson">JSON 가져오기</button></div>
  <p class="sub">기록 ${alive().length}개, 연결 ${liveLinks().length}개</p>
  <div class="danger-zone"><h2>모두 지우기</h2><p class="sub">모든 기록과 연결을 지워요. 설정과 대상은 남아요. 먼저 JSON 백업을 권해요.</p><button class="btn danger" data-act="wipe">모두 지우기</button></div>`;
}

/* ---------- 시트 ---------- */
function openSheet(html){const s=$('#sheet');s.innerHTML=html;s.classList.add('open');$('#scrim').classList.add('open');s.scrollTop=0;s.focus({preventScroll:true})}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('open');stack=[];ui.edit=null;softRender()}
function openDetail(id){
  const e=byId(id);if(!e){closeSheet();return}
  const E=ui.edit&&ui.edit.id===id?ui.edit:null;
  const isP=e.t==='p',linked=linkedOf(e).sort(byDate),ex=new Set(linked.map(x=>x.id));
  const cand=similar(e,isP?['a','g']:['p'],{k:4,exclude:ex}),same=isP?similar(e,['p'],{k:8,min:.25}):[];
  let h=stack.length>1?`<button class="back" data-act="back">← 이전 기록</button>`:'';
  const t=E?E.t:e.t;
  h+=`<div class="dh c-${t}"><span class="kind">${NAME[t]}</span><span class="dd">${fmtFull(e.d)}, ${hourOf(e)}시 작성</span></div>`;
  if(E){
    h+=`<textarea class="ed" id="edTx" aria-label="내용">${esc(e.text)}</textarea>
    <div class="seg types" style="margin-top:10px" role="group" aria-label="종류">${['g','p','a'].map(k=>`<button class="c-${k}" data-etype="${k}" aria-pressed="${E.t===k}">${NAME[k]}</button>`).join('')}</div>
    ${targets().length||E.who.length?`<div class="chips" style="margin-top:10px">${[...new Set([...targets(),...E.who])].map(w=>`<button class="wchip" data-ewho="${esc(w)}" aria-pressed="${E.who.includes(w)}">${esc(disp(w))}</button>`).join('')}</div>`:''}
    <label class="field"><span>날짜</span><input type="date" id="edD" value="${e.d}" max="${today()}"></label>
    <div class="row end"><button class="btn ghost" data-act="cancel">취소</button><button class="btn" data-act="saveEdit">저장</button></div>`;
  }else{
    h+=`<p class="big">${fmtText(e.text)}</p>`;
    if(e.who&&e.who.length)h+=`<div class="chips">${e.who.map(w=>`<span class="wp">${esc(disp(w))}</span>`).join('')}</div>`;
  }
  h+=`<h3>${isP?'이어진 응답과 감사':'이어진 간청'}</h3>`;
  h+=linked.length?`<div class="thread">${linked.map(x=>{
      const g=isP?daysBetween(e.d,x.d):daysBetween(x.d,e.d);
      const lab=isP?`${NAME[x.t]}, ${g>0?g+'일 뒤':g===0?'같은 날':(-g)+'일 앞서'}`:(g>0?`${g}일 전에 드린 간청`:'같은 무렵의 간청');
      const[p,a]=isP?[e.id,x.id]:[x.id,e.id];
      return `<div class="node c-${x.t}"><div class="elapsed">${lab}</div><button class="open" data-open="${x.id}">${fmtText(x.text)}</button><div class="nm">${fmtShortY(x.d)}<button class="link-x" data-unlink="${p}|${a}">연결 풀기</button></div></div>`}).join('')}</div>`
    :`<p class="sub">아직 없어요.</p>`;
  if(cand.length)h+=`<h3>닮은 ${isP?'응답과 감사':'간청'}</h3>`+cand.map(x=>{const[p,a]=isP?[e.id,x.id]:[x.id,e.id];
      return `<div class="cand"><button class="pick" data-open="${x.id}"><span class="pd">${NAME[x.t]}, ${fmtShortY(x.d)}</span><span class="pt">${fmtText(x.text)}</span></button><button class="btn small ghost" data-linkto="${p}|${a}">연결</button></div>`}).join('');
  if(same.length){const first=[e,...same].sort(byDate)[0];
    h+=`<h3>비슷하게 드린 간청</h3><p class="sub">같은 마음으로 ${same.length+1}번 구했어요. 처음은 ${fmtShortY(first.d)}.</p><div class="chips">${same.sort(byDate).map(x=>`<button class="chip" data-open="${x.id}">${fmtShortY(x.d)}</button>`).join('')}</div>`}
  if(!E)h+=`<div class="row end"><button class="btn danger" data-act="delete">지우기</button><button class="btn ghost" data-act="edit">고치기</button></div>`;
  openSheet(h);
}
function pushDetail(id){ui.edit=null;if(stack[stack.length-1]!==id)stack.push(id);openDetail(id)}

/* ---------- 렌더 ---------- */
function render(){
  const v=ui.view;document.body.classList.toggle('hide',!!set.hide);
  $('#app').innerHTML=v==='write'?viewWrite():v==='look'?viewLook():viewSettings();
  document.querySelectorAll('nav [data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===v?'page':'false'));
  const ta=$('#ta');if(ta){autosize(ta);renderFloat()}
}
function softRender(){
  const a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&$('#app').contains(a)){
    if($('#lists'))$('#lists').innerHTML=writeLists();
    if($('#months'))$('#months').innerHTML=monthsHTML(currentList());
    syncComposer();
  }else render();
}
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- 내보내기 ---------- */
function toMarkdown(){
  let md=`# 기도 한 줄\n\n내보낸 날: ${today()}\n`,cur='',day='';
  for(const e of alive().sort((a,b)=>byDate(a,b)||'gpa'.indexOf(a.t)-'gpa'.indexOf(b.t))){
    const k=e.d.slice(0,7);if(k!==cur){cur=k;const[y,m]=k.split('-');md+=`\n## ${y}년 ${+m}월\n`}
    if(e.d!==day){day=e.d;md+=`\n### ${e.d}\n\n`}
    const who=(e.who||[]).map(w=>' @'+w).join('');
    md+=`- ${hourOf(e)}시 [${NAME[e.t]}]${who} ${e.text.replace(/\n/g,' ')}\n`;
    for(const x of linkedOf(e).sort(byDate))md+=`  - ${NAME[x.t]} ${x.d}: ${x.text.replace(/\n/g,' ')}\n`;
  }
  return md;
}
async function download(name,text,type){
  const blob=new Blob([text],{type});
  try{const f=new File([blob],name,{type});if(/iPhone|iPad/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',async ev=>{
  if(ev.target.id==='scrim'){closeSheet();return}
  const b=ev.target.closest('button');if(!b)return;const D=b.dataset;
  if(D.view){ui.view=D.view;render();scrollTo(0,0);return}
  if(D.mode){ui.manual=true;ui.mode=D.mode;ui.flo=null;syncComposer();return}
  if(D.who!==undefined){const w=D.who;ui.who=ui.who.includes(w)?ui.who.filter(x=>x!==w):[...ui.who,w];refreshWho();renderFloat();return}
  if(b.id==='save'){doSave();return}
  if(D.open){pushDetail(D.open);return}
  if(D.pick){const on=b.getAttribute('aria-pressed')!=='true';setLink(D.pick,D.ans,on);b.setAttribute('aria-pressed',on);if(on)toast('연결했어요');return}
  if(D.linkto){const[p,a]=D.linkto.split('|');setLink(p,a,true);openDetail(stack[stack.length-1]);toast('연결했어요');return}
  if(D.unlink){const[p,a]=D.unlink.split('|');setLink(p,a,false);openDetail(stack[stack.length-1]);return}
  if(D.etype){ui.edit.text=$('#edTx').value;ui.edit.t=D.etype;keepEditText();return}
  if(D.ewho!==undefined){const w=D.ewho,E=ui.edit;E.text=$('#edTx').value;E.who=E.who.includes(w)?E.who.filter(x=>x!==w):[...E.who,w];keepEditText();return}
  if(D.filter){ui.filter=D.filter;render();return}
  if(D.tag){ui.tag=ui.tag===D.tag?null:D.tag;render();return}
  const cur=byId(stack[stack.length-1]);
  switch(D.act){
    case 'hide':set.hide=!set.hide;saveSet();document.body.classList.toggle('hide',set.hide);document.querySelectorAll('.eye').forEach(x=>{x.setAttribute('aria-pressed',set.hide);x.textContent=set.hide?'보이기':'가리기'});break;
    case 'back':stack.pop();ui.edit=null;openDetail(stack[stack.length-1]);break;
    case 'edit':ui.edit={id:cur.id,t:cur.t,who:[...(cur.who||[])],text:cur.text};openDetail(cur.id);break;
    case 'cancel':ui.edit=null;openDetail(cur.id);break;
    case 'saveEdit':{
      const E=ui.edit,t=$('#edTx').value.trim(),d=$('#edD').value||cur.d;if(!t){toast('내용이 비어 있어요');break}
      if((cur.t==='p')!==(E.t==='p'))data.links.forEach(l=>{if((l.p===cur.id||l.a===cur.id)&&!l.del){l.del=true;l.u=Date.now()}});
      cur.text=t;cur.d=d>today()?today():d;cur.t=E.t;cur.who=E.who.length?E.who:undefined;cur.u=Date.now();commit();
      ui.edit=null;openDetail(cur.id);toast('고쳤어요');break}
    case 'delete':if(confirm('이 기록을 지울까요? 연결도 함께 풀려요.')){delEntry(cur);closeSheet();toast('지웠어요')}break;
    case 'wipe':{const n=alive().length;if(!n){toast('지울 기록이 없어요');break}
      const ans=prompt(`기록 ${n}개와 모든 연결을 지워요. 동기화된 다른 기기에서도 지워지고 되돌릴 수 없어요.\n계속하려면 "모두 지우기"라고 입력하세요.`);
      if(ans!=='모두 지우기'){if(ans!==null)toast('입력이 달라 취소했어요');break}
      const now=Date.now();data.entries.forEach(e=>{if(!e.del){e.del=true;e.text='';e.who=undefined;e.u=now}});data.links.forEach(l=>{l.del=true;l.u=now});
      commit();render();toast('모두 지웠어요');break}
    case 'createGist':try{await gistCreate();render();setStatus(true,'새 Gist를 만들었어요');toast('Gist ID를 다른 기기에도 넣어 주세요')}catch(e){setStatus(false,e.message)}break;
    case 'syncNow':sync();break;
    case 'exMd':download(`기도-한-줄-${today()}.md`,toMarkdown(),'text/markdown');break;
    case 'exJson':download(`기도-한-줄-백업-${today()}.json`,JSON.stringify(data),'application/json');break;
    case 'imJson':$('#importFile').click();break;
  }
});
function keepEditText(){const txt=ui.edit.text;openDetail(ui.edit.id);const t=$('#edTx');if(t)t.value=txt}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='ta'){ui.draft=t.value;ui.flo=null;autosize(t);clearTimeout(floatT);floatT=setTimeout(renderFloat,t.value.trim()?450:0)}
  if(t.id==='q'){ui.q=t.value;$('#months').innerHTML=monthsHTML(currentList())}
});
document.addEventListener('keydown',ev=>{
  if(ev.target.id==='ta'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing&&ev.keyCode!==229){ev.preventDefault();doSave()}
  if(ev.key==='Escape'&&$('#sheet').classList.contains('open'))closeSheet();
});
document.addEventListener('change',async ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.set;
  if(t.id==='dateIn'){const v=t.value;ui.date=(!v||v>=today())?null:v;t.value=workDay();t.classList.toggle('past',!!ui.date);ui.manual=false;ui.flo=null;$('#lists').innerHTML=writeLists();syncComposer();return}
  if(t.id==='targetsIn'){setCfg({targets:[...new Set(t.value.split(/[,，\n]/).map(x=>x.trim().replace(/^#/,'').replace(/[\s#.,!?]+/g,'_')).filter(Boolean))]});t.value=targets().map(disp).join(', ');toast('대상을 저장했어요');return}
  if(t.id==='thanksIn'){const n=Math.max(1,Math.min(10,parseInt(t.value)||3));setCfg({thanks:n});t.value=n;toast(`감사 ${n}가지로 정했어요`);return}
  if(k){set[k]=t.type==='checkbox'?t.checked:t.value.trim();saveSet();if(k!=='reverse'&&k!=='verse'){render();if(configured())sync()}return}
  if(t.id==='importFile'&&t.files[0]){
    try{const obj=await readAny(JSON.parse(await t.files[0].text()));data=merge(data,obj);commit();render();toast('가져와서 합쳤어요')}
    catch(e){toast(e.message||'읽을 수 없는 파일이에요')}
    t.value='';
  }
});
let hiddenAt=0,lastDay=today();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();if(pushT)sync();return}
  if(ui.date&&Date.now()-hiddenAt>30*60e3)ui.date=null;
  if(lastDay!==today()){lastDay=today();ui.manual=false;ui.date=null}
  if(!$('#sheet').classList.contains('open'))softRender();
  sync();
});

render();sync();
</script>
